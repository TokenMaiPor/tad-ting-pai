name: Release

# Builds the extension zip and attaches it to the GitHub release.
# Runs automatically when a release is published, or by hand for an existing tag.
on:
  release:
    types: [published]
  workflow_dispatch:
    inputs:
      tag:
        description: 'Existing release tag to (re)attach the zip to, e.g. v0.1.0'
        required: true

permissions:
  contents: write

concurrency:
  group: release-${{ github.event.release.tag_name || inputs.tag }}
  cancel-in-progress: false

jobs:
  zip:
    name: Build and attach extension zip
    runs-on: ubuntu-latest
    env:
      TAG: ${{ github.event.release.tag_name || inputs.tag }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ env.TAG }}
      - uses: actions/setup-node@v7
        with:
          node-version: 22
          cache: npm
      - run: npm ci

      - name: Check the tag matches package.json
        run: |
          version="v$(node -p "require('./package.json').version")"
          if [ "$version" != "$TAG" ]; then
            echo "::error::Tag $TAG does not match package.json version $version"
            exit 1
          fi

      - name: Test
        run: npm test

      - name: Build zip
        run: npm run zip

      - name: Privacy audit (no network APIs, minimal permissions)
        run: npm run audit:network

      - name: Attach zip to the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          zip=$(ls .output/*-chrome.zip)
          echo "Uploading $zip to $TAG"
          gh release upload "$TAG" "$zip" --clobber
